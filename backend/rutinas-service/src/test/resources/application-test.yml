# Pruebas: H2 en memoria en modo PostgreSQL, sin Docker.
spring:
  datasource:
    url: jdbc:h2:mem:rutinas;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

taskin:
  programacion:
    habilitada: false
  demo:
    habilitada: false
  evidencias:
    directorio: ${java.io.tmpdir}/taskin-pruebas/evidencias

# El simulador queda montado, pero sin mandar webhooks: las pruebas los firman y envian a mano
pasarela:
  sandbox:
    entregar-webhooks: false
