# Perfil local: PostgreSQL levantado con docker-compose (ver README).
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rutinas}
    username: ${DB_USER:rutinas}
    password: ${DB_PASSWORD:rutinas}
    hikari:
      maximum-pool-size: 5
  jpa:
    show-sql: true

logging:
  level:
    mx.unam.buzz.rutinas: DEBUG
