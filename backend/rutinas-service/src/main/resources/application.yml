spring:
  application:
    name: rutinas-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  messages:
    basename: messages
    encoding: UTF-8
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo crea database/01_schema.sql, no Hibernate
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  servlet:
    multipart:
      # Evidencias: 5 MB por foto (lo vuelve a exigir el dominio)
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    date-format: "yyyy-MM-dd'T'HH:mm:ss"
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      # Validacion estricta: un campo que no esta en el DTO es un 400
      fail-on-unknown-properties: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    # Todas las rutas cuelgan de /api/v1 (version en la URL)
    context-path: /api/v1
    encoding:
      charset: UTF-8
      force: true

# Swagger UI en /api/v1/api-docs; el contrato en JSON en /api/v1/api-docs/openapi.json
springdoc:
  api-docs:
    path: /api-docs/openapi.json
  swagger-ui:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

taskin:
  seguridad:
    # Llave HMAC del token de sesion (minimo 32 caracteres). En produccion va por variable de entorno.
    secreto: ${TASKIN_JWT_SECRET:taskin-solo-para-desarrollo-local-no-usar-en-produccion}
    duracion-horas: 12
  programacion:
    # Programa las rondas del dia y marca las vencidas
    habilitada: true
  demo:
    # Simula el historial de rondas e incidencias de los ultimos dias para la demostracion
    habilitada: ${TASKIN_DEMO:false}
    dias-historial: 6
  evidencias:
    # Carpeta de las fotos. En un contenedor, montar un volumen aqui.
    directorio: ${TASKIN_EVIDENCIAS_DIR:${user.home}/.taskin/evidencias}
  pagos:
    dias-prueba: 14
    pasarela:
      # En produccion seria la URL del proveedor; aqui, el simulador montado en este mismo servidor
      url: ${TASKIN_PASARELA_URL:http://localhost:${server.port}/api/v1/sandbox/pasarela}
      llave-secreta: ${TASKIN_PASARELA_LLAVE_SECRETA:sk_test_taskin_sandbox}
      secreto-webhook: ${TASKIN_PASARELA_SECRETO_WEBHOOK:whsec_taskin_sandbox}
      # Una firma mas vieja que esto se rechaza (replay)
      tolerancia-segundos: 300
    emisor:
      rfc: BUZ260917AB1
      razon-social: TASKIN FOR SMALL BUSINESS
      regimen-fiscal: "601"
      codigo-postal: "04510"
    transferencia:
      banco: BANCO SANDBOX
      clabe: "999180001234567899"
      beneficiario: TASKIN FOR SMALL BUSINESS

# Simulador de pasarela (modulo pasarela-sandbox). Apagado en produccion.
pasarela:
  sandbox:
    habilitada: ${PASARELA_SANDBOX:true}
    llave-publica: pk_test_taskin_sandbox
    llave-secreta: ${TASKIN_PASARELA_LLAVE_SECRETA:sk_test_taskin_sandbox}
    secreto-webhook: ${TASKIN_PASARELA_SECRETO_WEBHOOK:whsec_taskin_sandbox}
    url-webhook: http://localhost:${server.port}/api/v1/pagos/webhook
    retraso-ms: 1500
    reintentos: 3
    duplicar-webhook: false
