spring:
  application:
    name: rutinas-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  messages:
    basename: messages
    encoding: UTF-8
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo crea database/01_schema.sql, no Hibernate
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  jackson:
    date-format: "yyyy-MM-dd'T'HH:mm:ss"
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      # Validacion estricta: un campo que no esta en el DTO es un 400
      fail-on-unknown-properties: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    # Todas las rutas cuelgan de /api/v1 (version en la URL)
    context-path: /api/v1
    encoding:
      charset: UTF-8
      force: true

# Swagger UI en /api/v1/api-docs; el contrato en JSON en /api/v1/api-docs/openapi.json
springdoc:
  api-docs:
    path: /api-docs/openapi.json
  swagger-ui:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
