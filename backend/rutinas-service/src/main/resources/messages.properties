# Mensajes de error. Clave: error.<codigo>. Cada modulo usa su propio rango.

# Generales (0-999)
error.0=Ocurrió un error inesperado.
error.1=La petición no es válida.
error.2=Faltan los parámetros de la petición.
error.3=El identificador es obligatorio.
error.404=La búsqueda no arrojó resultados.

# Areas (1000-1099)
error.1001=El nombre del área es obligatorio.
error.1002=Ya existe un área activa con ese nombre.
error.1003=El área no existe o fue eliminada.
