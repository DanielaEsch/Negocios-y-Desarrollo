# Mensajes de error. Clave: error.<codigo>. Cada modulo usa su propio rango.

# Generales (0-999)
error.0=Ocurrió un error inesperado.
error.1=La petición no es válida.
error.2=Faltan los parámetros de la petición.
error.3=El identificador es obligatorio.
error.404=La búsqueda no arrojó resultados.

# Areas (1000-1099)
error.1001=El nombre del área es obligatorio.
error.1002=Ya existe un área activa con ese nombre.
error.1003=El área no existe o fue eliminada.

# Validacion de los DTOs de entrada (Bean Validation)
validacion.nombre.obligatorio=El nombre es obligatorio.
validacion.nombre.largo=El nombre admite como máximo {max} caracteres.
validacion.descripcion.largo=La descripción admite como máximo {max} caracteres.
validacion.page.minimo=La página empieza en {value}.
validacion.size.maximo=El tamaño de página admite como máximo {value}.
validacion.size.minimo=El tamaño de página debe ser al menos {value}.
