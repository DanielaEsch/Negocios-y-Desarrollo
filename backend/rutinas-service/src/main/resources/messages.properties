# Mensajes de error. Clave: error.<codigo>. Cada modulo usa su propio rango.

# Generales (0-999)
error.0=Ocurrió un error inesperado.
error.1=La petición no es válida.
error.2=Faltan los parámetros de la petición.
error.3=El identificador es obligatorio.
error.404=La búsqueda no arrojó resultados.

# Areas (1000-1099)
error.1001=El nombre del área es obligatorio.
error.1002=Ya existe un área activa con ese nombre.
error.1003=El área no existe o fue eliminada.

# Validacion de los DTOs de entrada (Bean Validation)
validacion.nombre.obligatorio=El nombre es obligatorio.
validacion.nombre.largo=El nombre admite como máximo {max} caracteres.
validacion.descripcion.largo=La descripción admite como máximo {max} caracteres.
validacion.page.minimo=La página empieza en {value}.
validacion.size.maximo=El tamaño de página admite como máximo {value}.
validacion.size.minimo=El tamaño de página debe ser al menos {value}.

# Sesion y permisos (1100-1199)
error.1101=El correo o la contraseña no son correctos.
error.1102=Inicia sesión para continuar.
error.1103=Tu sesión expiró o no es válida. Vuelve a iniciar sesión.
error.1104=Tu perfil no tiene permiso para esta acción.

# Usuarios (1200-1299)
error.1201=Ya existe un usuario activo con ese correo.
error.1202=El usuario no existe o fue dado de baja.
error.1203=Una de las áreas no existe o fue eliminada.
error.1204=Por ahora solo se puede promover a SUPERVISOR.
error.1205=No puedes darte de baja a ti mismo.

# Rutinas (1300-1399)
error.1301=La rutina no existe o fue eliminada.
error.1302=El área de la rutina no existe o fue eliminada.
error.1303=Ya existe una rutina activa con ese nombre en el área.
error.1304=La rutina es de un área que no tienes asignada.
error.1305=Solo las rutinas por evento se lanzan a mano.

# Ejecuciones (1400-1499)
error.1401=La ronda no existe.
error.1402=La ronda es de un área que no tienes asignada.
error.1403=La tarea no pertenece a esta ronda.
error.1404=Ese cambio de estado no se puede pedir por la API.
error.1405=Alguien más modificó la ronda mientras la veías. Recarga para ver su estado actual.

# Incidencias (1500-1599)
error.1501=La incidencia no existe.
error.1502=Ese cambio de estado no se puede pedir por la API.
error.1503=La incidencia es de un área que no tienes asignada.

validacion.correo.obligatorio=El correo es obligatorio.
validacion.correo.formato=El correo no tiene un formato válido.
validacion.correo.largo=El correo admite como máximo {max} caracteres.
validacion.contrasena.obligatoria=La contraseña es obligatoria.
validacion.contrasena.largo=La contraseña debe tener entre {min} y {max} caracteres.
validacion.consentimiento.obligatorio=Sin aceptar el aviso de privacidad no se puede registrar al usuario.
validacion.perfil.obligatorio=El perfil es obligatorio.
validacion.areas.obligatorias=Asigna al menos un área.
validacion.area.obligatoria=El área es obligatoria.
validacion.frecuencia.obligatoria=La frecuencia es obligatoria.
validacion.dia.rango=El día de la semana va de {min} (lunes) a {max} (domingo).
validacion.tareas.obligatorias=La rutina necesita al menos una tarea.
validacion.tareas.maximo=Una rutina admite como máximo {max} tareas.
validacion.tarea.obligatoria=Ninguna tarea puede ir vacía.
validacion.tarea.largo=Cada tarea admite como máximo {max} caracteres.
validacion.estado.obligatorio=El estado es obligatorio.
validacion.version.obligatoria=La versión es obligatoria para el bloqueo optimista.
validacion.descripcion.obligatoria=Describe qué pasó.
validacion.incidencia.largo=El texto admite como máximo {max} caracteres.
